name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # NB: pyspharm/windspharm are NOT installed in CI.
          # They require Fortran + numpy.distutils (removed in numpy 2.0)
          # and brittle PEP-517 dance with --no-build-isolation.
          # The SH backend is now an optional [sh] extra; tests that
          # depend on it use pytest.importorskip('spharm') and skip
          # cleanly when it is absent. Local users install it via:
          #     micromamba install -c conda-forge windspharm pyspharm
          pip install .[test]

      - name: Run tests
        run: pytest -v --tb=short
