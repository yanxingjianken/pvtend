name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system build deps for pyspharm
        run: sudo apt-get update && sudo apt-get install -y gfortran

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # numpy must exist before pyspharm's setup.py runs (no PEP 517
          # build isolation because pyspharm imports numpy at build time)
          pip install "numpy>=1.22"
          pip install --no-build-isolation pyspharm windspharm
          pip install .[test]

      - name: Run tests
        run: pytest
