name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system build deps for pyspharm
        run: sudo apt-get update && sudo apt-get install -y gfortran

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # --no-build-isolation means pip uses the *current* env to build
          # pyspharm's sdist, so setuptools/wheel/numpy/Cython must already
          # be installed. pyspharm 1.0.9 setup.py uses numpy.distutils,
          # which was removed in NumPy 2.0 — pin numpy<2 for the BUILD,
          # then upgrade afterwards if pvtend's deps want a newer numpy.
          pip install "setuptools>=64,<74" wheel "numpy<2" "Cython>=0.29"
          pip install --no-build-isolation pyspharm windspharm
          pip install .[test]

      - name: Run tests
        run: pytest
